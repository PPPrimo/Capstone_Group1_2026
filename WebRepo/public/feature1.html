<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remote Control</title>
  <link rel="stylesheet" href="./assets/base.css?v=20261103-2" />
  <link rel="stylesheet" href="./assets/feature1.css?v=20261103-1" />
</head>
<body>
  <section id="feature1" class="panel">
    <div id="feature1_top_bar" class="toolbar">
      <label for="featureSelect">View
        <select id="featureSelect">
          <option value="feature1" selected>Remote Control</option>
          <option value="feature2">Placeholder</option>
          <option value="feature3" hidden>Server Status</option>
        </select>
      </label>
      <label class="robot-selector" for="robotName">Robot name
        <select id="robotName" disabled><option value="">Select robot</option></select>
      </label>
      <label class="robot-selector" for="robotRole">Robot role
        <select id="robotRole" disabled><option value="">Select role</option></select>
      </label>
      <label class="robot-selector" for="tbt">Control:
        <select id="tbt" disabled>
          <option value="Control_Through_Server">through_server</option>
          <option value="Direct_Control">directly</option>
          <option value="None" selected>None</option>
        </select>
      </label>
      <p id="robotStatus" role="status">Loading robots...</p>
    </div>

    <!-- Main content region -->
    <div id="feature1_middle">

      <div id="feature1_middle_middle">

        <div class="video-container">
          <video
            id="remoteVideo"
            autoplay
            playsinline
            muted
            controls
          ></video>
        </div>

      </div>

    </div>

    <!-- Bottom bar -->
    <div id="feature_1_bottom">
      <label class="connection-toggle" title="Retry failed connections until one succeeds">
        <input id="retryConnection" type="checkbox" role="switch" checked /> Retry connection
      </label>
      <label class="connection-toggle" title="Enable sending commands to the robot">
        <input id="masterMode" type="checkbox" role="switch" disabled /> Master mode
      </label>
      <span id="latency" title="latency_avg_ms reported by the robot">Latency: N/A</span>
      <div id="liveData">Waiting for data...</div>
    </div>

  </section>
  <script type="module" src="./src/webrtc_setup.js?v=20261102-2"></script>
  <script src="./assets/read_only.js?v=20251222"></script>
</body>
</html>
