# Minimal Nginx reverse proxy with Basic Auth protecting the FastAPI app

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       C:/Users/tiant/Documents/1_My_folder/Projects/Websites/server/nginx/conf/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Rate limit zone for login attempts (10 requests per minute per IP)
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

    server {
        listen       443 ssl;
        server_name  localhost;

        ssl_certificate     C:/Users/tiant/Documents/1_My_folder/Projects/Websites/Resources/ssl/server.crt;
        ssl_certificate_key C:/Users/tiant/Documents/1_My_folder/Projects/Websites/Resources/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'self'" always;

        # Block access to server internals
        location ^~ /server/ {
            return 403;
        }

        # Optionally block Resources and tools directories from direct access
        location ^~ /Resources/ {
            return 403;
        }
        location ^~ /tools/ {
            return 403;
        }

        # Rate limit login endpoint (FastAPI-Users)
        location = /auth/jwt/login {
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            limit_req zone=login_zone burst=5 nodelay;
            proxy_pass http://127.0.0.1:8000;
        }

        # Logout endpoint (FastAPI-Users)
        location = /auth/jwt/logout {
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://127.0.0.1:8000;
        }

        # Proxy all other requests to FastAPI so app can enforce login
        location / {
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://127.0.0.1:8000;
        }

        # WebSocket endpoint for WebRTC signaling
        location = /api/webrtc/signal {
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_buffering off;
            proxy_cache off;
            tcp_nodelay on;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            proxy_pass http://127.0.0.1:8000;
        }
    }
}