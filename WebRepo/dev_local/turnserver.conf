# Local development only; matches RunWeb.bat.
listening-port=3478
listening-ip=0.0.0.0
realm=localhost
fingerprint
use-auth-secret
static-auth-secret=local-test-only
min-port=49160
max-port=49200
allow-loopback-peers
no-tls
no-dtls
no-cli
userdb=/tmp/capstone-turnserver.db
pidfile=/tmp/capstone-turnserver.pid
log-file=/tmp/capstone-turnserver.log
simple-log
